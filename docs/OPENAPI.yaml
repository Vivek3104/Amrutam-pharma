openapi: 3.0.3
info:
  title: Amrutam Telemedicine Backend API
  version: 1.0.0
  description: >
    Production-grade RESTful API specification for Amrutam's Telemedicine Backend.
    Supports 100k daily consultations with high availability, field-level PHI encryption, 
    MFA, idempotency, and RBAC security.
servers:
  - url: http://localhost:3000/api/v1
    description: Local Development Server
  - url: https://api.amrutam.co/v1
    description: Production Cluster

paths:
  /auth/register:
    post:
      summary: Register new user (Patient/Doctor/Admin)
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - fullName
                - role
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                fullName:
                  type: string
                role:
                  type: string
                  enum: [PATIENT, DOCTOR, ADMIN]
                phone:
                  type: string
                specialty:
                  type: string
                consultationFee:
                  type: number
      responses:
        '201':
          description: User created successfully
        '400':
          description: Validation error or user already exists

  /auth/login:
    post:
      summary: Login user & return JWT token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                password:
                  type: string
                mfaCode:
                  type: string
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials or MFA required

  /doctors/slots:
    post:
      summary: Create availability slot (Doctor only)
      tags:
        - Doctor
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - startTime
                - endTime
              properties:
                startTime:
                  type: string
                  format: date-time
                endTime:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Slot created

  /bookings:
    post:
      summary: Book consultation with Redlock & Saga idempotency
      tags:
        - Booking
      security:
        - BearerAuth: []
      parameters:
        - in: header
          name: X-Idempotency-Key
          schema:
            type: string
            format: uuid
          required: false
          description: Optional idempotency key to prevent double charging
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - doctorId
                - slotId
              properties:
                doctorId:
                  type: string
                  format: uuid
                slotId:
                  type: string
                  format: uuid
                consultationType:
                  type: string
                  enum: [AUDIO, VIDEO, CHAT]
                paymentGatewayToken:
                  type: string
      responses:
        '201':
          description: Consultation booked successfully
        '409':
          description: Slot already booked or lock conflict

  /prescriptions:
    post:
      summary: Issue encrypted prescription (Doctor only)
      tags:
        - Prescription
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - consultationId
                - doctorId
                - patientId
                - diagnosis
                - medicines
              properties:
                consultationId:
                  type: string
                  format: uuid
                doctorId:
                  type: string
                  format: uuid
                patientId:
                  type: string
                  format: uuid
                diagnosis:
                  type: string
                medicines:
                  type: array
                  items:
                    type: object
                notes:
                  type: string
      responses:
        '201':
          description: Prescription issued with HMAC signature

  /search/doctors:
    get:
      summary: Search doctors with Redis Cache-Aside
      tags:
        - Search
      parameters:
        - in: query
          name: specialty
          schema:
            type: string
        - in: query
          name: minRating
          schema:
            type: number
        - in: query
          name: maxFee
          schema:
            type: number
      responses:
        '200':
          description: Array of matching doctor records

  /analytics/overview:
    get:
      summary: Fetch admin system metrics & revenue overview (Admin only)
      tags:
        - Analytics
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Analytics dashboard metrics

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
